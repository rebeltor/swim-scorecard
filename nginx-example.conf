# Example Nginx server block for Swim Scorecard installed at /var/www/html/swim-scorecard.
# Change server_name, the certificate paths and fastcgi_pass to match your server.
# Find your PHP-FPM socket with: ls /run/php/ /run/php-fpm/

server {
    listen 443 ssl;
    server_name scores.example.com;

    ssl_certificate     /etc/letsencrypt/live/scores.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/scores.example.com/privkey.pem;

    root /var/www/html;
    index index.php index.html;

    # Never serve saved scorecards, server code or settings directly.
    location ^~ /swim-scorecard/data/ { return 404; }
    location ^~ /swim-scorecard/src/  { return 404; }
    location ~ ^/swim-scorecard/(config\.php|INSTALL\.md|nginx-example\.conf|THIRD-PARTY-LICENSES\.txt)$ { return 404; }

    # Static files. index.php adds ?v=... to each file, so updates are picked up right away.
    location ^~ /swim-scorecard/assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /swim-scorecard/ {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php-fpm.sock;    # Amazon Linux/RHEL: unix:/run/php-fpm/www.sock
    }
}

# Send plain HTTP to HTTPS.
server {
    listen 80;
    server_name scores.example.com;
    return 301 https://$host$request_uri;
}
